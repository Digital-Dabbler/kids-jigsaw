<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8ed8f8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="拼图小岛">
<title>拼图小岛 · 儿童拼图</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sky" aria-hidden="true"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i></div>

<section id="home" class="screen">
  <header class="topbar">
    <h1 class="logo">拼图小岛</h1>
    <button id="sound-btn" class="btn btn-round js-sound" type="button" aria-label="声音开关">🔊</button>
  </header>
  <div class="stage">
    <button id="prev-img" class="btn btn-arrow" type="button" aria-label="上一个图案">‹</button>
    <div id="preview-card" class="card preview-card">
      <div class="preview-slot" id="preview-slot"></div>
      <button id="del-custom" class="del-btn hidden" type="button" aria-label="删除这张图">✕</button>
    </div>
    <button id="next-img" class="btn btn-arrow" type="button" aria-label="下一个图案">›</button>
  </div>
  <div class="page-meta"><span id="page-counter" class="counter"></span></div>
  <div id="level-row" class="level-row"></div>
  <div class="cta-row">
    <button id="start-btn" class="btn btn-yellow btn-cta" type="button">开始拼图</button>
  </div>
</section>

<input id="file-input" type="file" accept="image/*" class="hidden" tabindex="-1" aria-hidden="true">
<div id="toast" class="toast" role="status"></div>

<section id="game" class="screen hidden">
  <header class="hud">
    <button id="back-btn" class="btn btn-round" type="button" aria-label="返回">‹</button>
    <span class="badge badge-cur hud-badge"><span class="badge-num" id="hud-level">C1</span></span>
    <div class="progress">
      <div id="progress-fill" class="progress-fill"></div>
      <span id="progress-text" class="progress-text">0/8</span>
    </div>
    <button id="peek-btn" class="btn btn-round" type="button" aria-label="按住看全图">👁</button>
    <button id="sound-btn-2" class="btn btn-round js-sound" type="button" aria-label="声音开关">🔊</button>
  </header>
  <div id="board-wrap">
    <canvas id="board"></canvas>
  </div>
  <div id="peek-overlay" class="overlay hidden"><img id="peek-img" alt="完整图案预览"></div>
</section>

<div id="done" class="overlay hidden">
  <div class="panel">
    <h2>拼完啦！</h2>
    <div id="stars" class="stars"></div>
    <p id="done-time" class="done-time"></p>
    <div class="cta-row">
      <button id="next-level-btn" class="btn btn-yellow" type="button">下一关</button>
      <button id="retry-btn" class="btn btn-green" type="button">再玩一次</button>
      <button id="home-btn" class="btn" type="button">回家</button>
    </div>
  </div>
</div>
<canvas id="confetti" class="hidden"></canvas>

<script src="js/levels.js"></script>
<script src="js/rng.js"></script>
<script src="js/geometry.js"></script>
<script src="js/pieces.js"></script>
<script src="js/storage.js"></script>
<script src="js/images.js"></script>
<script src="js/game.js"></script>
<script src="js/format.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui-home.js"></script>
<script src="js/ui-game.js"></script>
<script src="js/ui-done.js"></script>
<script src="js/main.js"></script>
</body>
</html>
