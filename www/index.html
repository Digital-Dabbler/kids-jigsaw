<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8ed8f8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="拼图小岛">
<title>拼图小岛 · 儿童拼图</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sky" aria-hidden="true"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i></div>

<section id="home" class="screen">
  <header class="topbar">
    <h1 class="logo">拼图小岛</h1>
    <button id="sound-btn" class="btn btn-round" type="button" aria-label="声音开关">🔊</button>
  </header>
  <div class="stage">
    <button id="prev-img" class="btn btn-arrow" type="button" aria-label="上一个图案">‹</button>
    <div id="preview-card" class="card preview-card"><div class="preview-slot" id="preview-slot"></div></div>
    <button id="next-img" class="btn btn-arrow" type="button" aria-label="下一个图案">›</button>
  </div>
  <div id="level-row" class="level-row"></div>
  <div class="cta-row">
    <button id="start-btn" class="btn btn-yellow btn-cta" type="button">开始拼图</button>
  </div>
</section>

<script src="js/levels.js"></script>
<script src="js/rng.js"></script>
</body>
</html>
